name: Build Tor Browser iOS IPA
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tor-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: minh-ton/reynard-browser
          ref: ddaacd18b8c5661d495acfc0f3e90a86c484e64d
          path: upstream
      - run: python3 -m unittest discover -s tests -v
        env:
          UPSTREAM_SOURCE: upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/tor-isolation.mjs
  build:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: tor-ios-v1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Tor overlay
        uses: actions/checkout@v4
      - name: Checkout pinned Reynard
        uses: actions/checkout@v4
        with:
          repository: minh-ton/reynard-browser
          ref: ddaacd18b8c5661d495acfc0f3e90a86c484e64d
          path: upstream
          fetch-depth: 1
          submodules: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Test native proxy routing and fail-closed behavior
        run: |
          xcrun swiftc -typecheck -default-isolation MainActor -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.4 overlay/Reynard/Tor/TorNetwork.swift
          swiftc overlay/Reynard/Tor/TorNetwork.swift tests/native/main.swift -o /tmp/tor-proxy-check
          python3 scripts/test-native-proxy.py /tmp/tor-proxy-check
      - name: Type-check Tor interface against UIKit
        run: |
          xcrun swiftc -typecheck -default-isolation MainActor -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.4 -import-objc-header overlay/Reynard/Tor/TorService.h overlay/Reynard/Tor/TorNetwork.swift overlay/Reynard/Tor/TorPrivacy.swift overlay/Reynard/Tor/TorStatusViewController.swift overlay/Reynard/Tor/TorBrowserStatus.swift tests/ios-stubs.swift
      - name: Install dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm cocoapods
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Cache dependencies
        id: dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            ~/Library/Caches/CocoaPods
          key: tor-ios-deps-v1-${{ runner.arch }}-${{ hashFiles('upstream.lock.json', 'Podfile') }}
          restore-keys: tor-ios-deps-v1-${{ runner.arch }}-
      - name: Apply Tor integration
        run: python3 scripts/apply-overlay.py upstream browser
      - name: Parse modified native stores and navigation policy
        run: |
          xcrun swiftc -frontend -parse -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.4 upstream/browser/Reynard/Client/Stores/{HistoryStore,TabManagementStore,NavigationHistoryStore,FaviconStore,SiteMetadataStore,SitePermissionStore}.swift upstream/browser/GeckoView/Delegates/NavigationDelegate.swift
      - name: Integrate pinned embedded Tor
        working-directory: upstream/browser
        run: |
          pod install
          cp Podfile.lock ../../Podfile.resolved.lock
      - name: Compile Tor and validate application project early
        working-directory: upstream/browser
        run: |
          xcodebuild -project Pods/Pods.xcodeproj -scheme Tor -derivedDataPath /tmp/TorPods -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../../tor-build.log
          xcrun clang -fsyntax-only -fobjc-arc -fblocks -target arm64-apple-ios17.4 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -Fbuild/Release-iphoneos/Tor -F/tmp/TorPods/Build/Products/Release-iphoneos/Tor -I../../overlay/Reynard/Tor ../../overlay/Reynard/Tor/TorService.m
          xcodebuild -workspace Reynard.xcworkspace -scheme Reynard -showBuildSettings CODE_SIGNING_ALLOWED=NO > ../../app-build-settings.log
      - name: Initialize engine and JIT sources
        working-directory: upstream
        run: |
          git submodule update --init --recursive support/idevice
          ./tools/development/update-gecko.sh
          ./tools/development/apply-patches.sh
      - name: Apply Tor policy before engine compilation
        run: python3 scripts/apply-overlay.py upstream engine
      - name: Validate Gecko preference names and module syntax
        run: |
          python3 scripts/check-gecko-prefs.py upstream/engine/firefox
          node --check upstream/engine/firefox/mobile/shared/modules/geckoview/TBIOPrivacy.sys.mjs
          node --check upstream/engine/firefox/mobile/shared/components/geckoview/GeckoViewStartup.sys.mjs
      - name: Fingerprint native build toolchain
        id: toolchain
        run: |
          digest=$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; rustc -Vv; clang --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore compiled engine and JIT assets
        id: native-assets
        uses: actions/cache/restore@v4
        with:
          path: native-assets.tar
          key: tor-ios-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('upstream.lock.json', 'privacy-prefs.json', 'overlay/Gecko/**', 'scripts/apply-overlay.py') }}
      - name: Unpack compiled native assets
        if: steps.native-assets.outputs.cache-hit == 'true'
        run: tar -xf native-assets.tar -C upstream
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build Gecko
        if: steps.native-assets.outputs.cache-hit != 'true'
        working-directory: upstream
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber 2>&1 | tee ../gecko-build.log
      - name: Build JIT helper library
        if: steps.native-assets.outputs.cache-hit != 'true'
        working-directory: upstream
        run: ./tools/development/build-idevice.sh 2>&1 | tee ../idevice-build.log
      - name: Pack compiled native assets
        if: steps.native-assets.outputs.cache-hit != 'true'
        run: |
          # Dereference dist symlinks so the restored package is self-contained.
          tar -chf native-assets.tar -C upstream engine/firefox/obj-aarch64-apple-ios/dist browser/Reynard/JIT/RPPairing/libidevice_ffi.a
      - name: Save compiled assets before app archive
        if: steps.native-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-assets.tar
          key: ${{ steps.native-assets.outputs.cache-primary-key }}
      - name: Save downloaded dependencies before app archive
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            ~/Library/Caches/CocoaPods
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Archive app
        working-directory: upstream
        run: ./tools/release/build-app.sh --no-signing 2>&1 | tee ../app-build.log
      - name: Package IPA
        working-directory: upstream
        run: |
          ./tools/release/create-ipa.sh
          shasum -a 256 dist/Tor-Browser-iOS.ipa > dist/Tor-Browser-iOS.ipa.sha256
          unzip -l dist/Tor-Browser-iOS.ipa | grep -E 'Reynard.app/Reynard|Reynard Helper.appex|OpenIn.appex'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tor-Browser-iOS-unsigned
          path: |
            upstream/dist/Tor-Browser-iOS.ipa
            upstream/dist/Tor-Browser-iOS.ipa.sha256
            Podfile.resolved.lock
            upstream.lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            *-build.log
            app-build-settings.log
            Podfile.resolved.lock
          if-no-files-found: ignore
          retention-days: 7
